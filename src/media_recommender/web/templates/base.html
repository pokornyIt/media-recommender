<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Media Recommender{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <nav aria-label="Primary navigation">
        <a aria-current="page" href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="{{ url_for('provider_status') }}">Provider status</a>
        <a href="{{ url_for('netflix_import_page') }}">Netflix import</a>
        <a href="{{ url_for('jellyfin_sync_page') }}">Jellyfin synchronization</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">
      <div aria-live="polite" class="error-summary" role="alert">
        {% block errors %}{% endblock %}
      </div>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
