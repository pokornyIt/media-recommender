name: media-recommender

services:
  media-recommender:
    build:
      context: .
    image: media-recommender:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MEDIA_RECOMMENDER_DATABASE_PATH: /data/media-recommender.db
      MEDIA_RECOMMENDER_LOG_LEVEL: ${MEDIA_RECOMMENDER_LOG_LEVEL:-INFO}
      MEDIA_RECOMMENDER_WEB_SESSION_SECRET: ${MEDIA_RECOMMENDER_WEB_SESSION_SECRET:?set MEDIA_RECOMMENDER_WEB_SESSION_SECRET in .env}
      MEDIA_RECOMMENDER_DEFAULT_REGION: ${MEDIA_RECOMMENDER_DEFAULT_REGION:-CZ}
      MEDIA_RECOMMENDER_TMDB_API_TOKEN: ${MEDIA_RECOMMENDER_TMDB_API_TOKEN:-}
      MEDIA_RECOMMENDER_JELLYFIN_BASE_URL: ${MEDIA_RECOMMENDER_JELLYFIN_BASE_URL:-}
      MEDIA_RECOMMENDER_JELLYFIN_API_TOKEN: ${MEDIA_RECOMMENDER_JELLYFIN_API_TOKEN:-}
      MEDIA_RECOMMENDER_JELLYFIN_USER_ID: ${MEDIA_RECOMMENDER_JELLYFIN_USER_ID:-}
    volumes:
      - media-recommender-data:/data
    stop_grace_period: 30s

volumes:
  media-recommender-data:
