[project]
name = "media-recommender"
version = "0.0.0"
description = "Self-hosted media recommendation application"
readme = "README.md"
authors = [{ name = "pokornyIt" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "aiosqlite>=0.22,<0.23",
    "alembic>=1.18,<2",
    "fastapi>=0.135,<0.136",
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "sqlalchemy>=2.0.48,<3",
]

[dependency-groups]
dev = [
    "pydoclint==0.9.1",
    "pre-commit>=4.6,<5",
    "pyright>=1.1.404,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # The repository does not require per-file copyright notices.
    "D203", # Incompatible with D211.
    "D213", # Incompatible with D212.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-short-docstrings = false
skip-checking-private-functions = false
native-mode-noqa-location = "definition"
allow-init-docstring = true
exclude = "tests"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
